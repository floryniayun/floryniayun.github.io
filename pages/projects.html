<h2>📁 Projects</h2>
<small id="count" style="color:rgba(255,255,255,.5)">Loading data.json...</small>
<div class="grid" id="grid" style="margin-top:16px"></div>
<script>
fetch('../data.json?v='+Date.now()).then(r=>r.json()).then(DATA=>{
  document.getElementById('grid').innerHTML=DATA.projects.map(p=>`
    <div class="card"><div class="box">${p.icon}</div><h4>${p.title}</h4><p>${p.sub}</p><span class="badge">${p.tag}</span></div>
  `).join('');
  document.getElementById('count').innerText=DATA.projects.length+' projects • Edit data.json untuk ganti';
});
</script>
